# 临时快速 5-Fold CV 配置 - CPU 环境 + Embedding 模式

defaults:
  - experiment_base

experiment:
  name: "quick_cv_cpu_embedding"
  description: "CPU 快速 5-Fold CV - Embedding 模式"
  device: "cpu"

data:
  use_embedding: true
  spectrum_embedding_path: spectrum_dimension/diabetes_results/Light_CNN_MLP_features.csv
  clinical_embedding_path: data/clinical.csv

device:
  use_cuda: false
  mixed_precision: false

evaluation:
  cross_validation:
    enabled: true
    n_splits: 5
    shuffle: true
    random_state: 42
    inner_val_ratio: 0.15
